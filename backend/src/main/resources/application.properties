# Server Config
server.port=${PORT:8080}

# Application Name
spring.application.name=virtual-debugging-lab

# Database Configuration with Defaults & Env Override
spring.datasource.url=${DB_URL:jdbc:h2:mem:vdl;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# Let Spring Boot auto-detect driver (com.mysql.cj.jdbc.Driver or org.h2.Driver) based on the URL
# spring.datasource.driver-class-name is auto-detected


# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Explicit dialect based on URL - MySQL for prod, auto-detect for H2 dev
spring.jpa.database-platform=${HIBERNATE_DIALECT:}

# Connection pool health check
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# H2 Console (For Dev/Testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Custom Application Config
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000
app.ai.api-key=${AI_API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
